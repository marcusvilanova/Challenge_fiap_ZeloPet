# Blueprint do Render: backend (Java) + serviço de visão (Python). Os segredos são preenchidos no painel.
services:
  - type: web
    name: zelopet-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    plan: free
    envVars:
      - key: ZELO_SEED_DEMO
        value: "true"
      - key: ZELO_DEMO_PASSWORD
        sync: false            # escolha uma senha NOVA no painel (não use a do README)
      - key: ZELO_COOKIE_SECURE
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework       # o limite de requisições enxerga o IP real, não o do proxy
      - key: ZELO_LLM_PROVIDER
        value: local           # motor local (validado). Sem chave de IA generativa
      - key: ZELO_VISION_URL
        sync: false            # https://<serviço-de-visão>.onrender.com (opcional: sem ele o chat funciona e a foto avisa indisponível)
  - type: web
    name: zelopet-vision
    runtime: docker
    dockerfilePath: ./ia/vision/Dockerfile
    dockerContext: ./ia
    healthCheckPath: /health
    plan: free
